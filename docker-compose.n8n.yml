# music-sync in server mode: n8n (or any scheduler) triggers the sync over HTTP.
#
# Deploy in Portainer exactly like the default stack, but set
# "Compose path" to docker-compose.n8n.yml instead of docker-compose.yml.
#
# The container idles until something POSTs to /sync, so there is no internal
# schedule here -- n8n owns the timing.

services:
  music-sync:
    build: .
    image: music-sync:latest
    container_name: music-sync
    restart: unless-stopped
    environment:
      MODE: server

      # -- Required ------------------------------------------------------
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set SPOTIFY_CLIENT_ID in the stack environment}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set SPOTIFY_CLIENT_SECRET in the stack environment}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:?run the auth helper, then set SPOTIFY_REFRESH_TOKEN}
      PLAYLISTS: ${PLAYLISTS:?set PLAYLISTS in the stack environment}
      # A POST to /sync rewrites playlists, so the endpoint is never open.
      # Generate one with: openssl rand -hex 32
      API_TOKEN: ${API_TOKEN:?set API_TOKEN -- generate with 'openssl rand -hex 32'}

      # -- Required for private Deezer playlists --------------------------
      DEEZER_ACCESS_TOKEN: ${DEEZER_ACCESS_TOKEN:-}

      # -- Optional -------------------------------------------------------
      HTTP_PORT: ${HTTP_PORT:-8477}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Berlin}

      CREATE_MISSING_PLAYLISTS: ${CREATE_MISSING_PLAYLISTS:-true}
      SPOTIFY_PLAYLISTS_PUBLIC: ${SPOTIFY_PLAYLISTS_PUBLIC:-false}
      SPOTIFY_PLAYLIST_DESCRIPTION: ${SPOTIFY_PLAYLIST_DESCRIPTION:-Mirrored from Deezer by music-sync. Manual edits are overwritten.}

      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.72}
      DURATION_TOLERANCE_SECONDS: ${DURATION_TOLERANCE_SECONDS:-8}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-8}

      ALLOW_EMPTY_MIRROR: ${ALLOW_EMPTY_MIRROR:-false}
      ALLOW_PARTIAL_SOURCE: ${ALLOW_PARTIAL_SOURCE:-false}
      MAX_UNMATCHED_RATIO: ${MAX_UNMATCHED_RATIO:-1.0}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-5}
    ports:
      # Only needs to be reachable from n8n. If both run on the same Docker
      # network, drop this block and let n8n call http://music-sync:8477
      # directly instead of exposing the port on the host.
      - "${HTTP_PORT:-8477}:${HTTP_PORT:-8477}"
    volumes:
      - music-sync-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  music-sync-data:
