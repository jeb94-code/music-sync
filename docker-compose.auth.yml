# One-time token helper. Run this once, on a machine with a browser:
#
#     docker compose -f docker-compose.auth.yml run --rm --service-ports auth
#
# It lives in its own file on purpose. The deployment stacks declare
# SPOTIFY_REFRESH_TOKEN as required, and Compose validates every service in a
# file even when you only start one of them -- so keeping the helper here is
# what lets it run before that token exists.

services:
  auth:
    # No `image:` here on purpose: with one set, Compose tries to pull it first
    # and prints a "pull access denied" line before falling back to building,
    # which reads like a failure on the very first command you run.
    build: .
    entrypoint: ["python", "-m", "musicsync.auth"]
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8479/callback}
      DEEZER_APP_ID: ${DEEZER_APP_ID:-}
      DEEZER_APP_SECRET: ${DEEZER_APP_SECRET:-}
      DEEZER_REDIRECT_URI: ${DEEZER_REDIRECT_URI:-http://localhost:8479/callback}
      AUTH_PORT: ${AUTH_PORT:-8479}
    ports:
      - "${AUTH_PORT:-8479}:${AUTH_PORT:-8479}"
